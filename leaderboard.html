<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Eightysix° — Leaderboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="./icons/icon-192.png">

<link rel="stylesheet" href="./styles.css">
<style>
  /* Standalone TV/tablet display — not part of the SPA's view-switching.
     Portrait/vertical is the primary target (a tablet or vertically-
     mounted TV), so this is written portrait-first with clamp() sizes
     tuned for ~600-1200px-wide viewports; a landscape media query
     switches to a side-by-side layout as a secondary fallback. */
  /* Static display, no scrolling — #fit-wrapper is measured against the
     viewport in JS and scaled down as a whole (transform: scale) if its
     natural content height would overflow, instead of ever clipping or
     requiring a scroll. See autoFit() below. */
  html, body {
    overflow: hidden;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
  }
  #fit-wrapper {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 1600px;
    padding: clamp(20px, 4vw, 44px) clamp(18px, 4.2vw, 40px);
    transform-origin: center center;
  }
  ::-webkit-scrollbar { display: none; }

  .tv-glow {
    position: fixed;
    top: -20vh;
    left: 50%;
    width: 160vw;
    max-width: 1400px;
    aspect-ratio: 1;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- Header ---------- */
  .tv-header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: clamp(14px, 2.4vw, 24px);
    border-bottom: 1px solid var(--border-glass);
    margin-bottom: clamp(18px, 3vw, 32px);
    flex-shrink: 0;
  }
  .tv-brand { display: flex; align-items: center; gap: clamp(12px, 2vw, 20px); min-width: 0; }
  .tv-logo { height: clamp(30px, 4.6vw, 48px); width: auto; filter: brightness(0) invert(1); flex-shrink: 0; }
  .tv-brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tv-title {
    font-size: clamp(18px, 3.4vw, 30px);
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .tv-subtitle {
    font-size: clamp(9px, 1.5vw, 13px);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .tv-clock {
    font-size: clamp(18px, 3.8vw, 34px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    text-align: right;
    white-space: nowrap;
  }
  .tv-date {
    font-size: clamp(9px, 1.5vw, 13px);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-align: right;
    white-space: nowrap;
  }

  /* ---------- Campaign banner ---------- */
  .tv-campaign {
    position: relative;
    z-index: 1;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
    background: var(--text-primary);
    color: var(--text-inverse);
    border-radius: var(--radius-lg);
    padding: clamp(10px, 2vw, 16px);
    margin-bottom: clamp(18px, 3vw, 28px);
    font-weight: 800;
    font-size: clamp(12px, 2.2vw, 18px);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
    animation: tvCampaignPulse 2.4s ease-in-out infinite;
  }
  .tv-campaign.show { display: flex; }
  @keyframes tvCampaignPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.0); }
    50% { box-shadow: 0 0 30px 4px rgba(255,255,255,0.15); }
  }

  /* ---------- Split layout: leaderboard + menu ---------- */
  /* Portrait/default: stacked, each section sized to its content —
     the page scrolls as a whole rather than clipping either list. */
  .split-main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 5vw, 44px);
  }
  .split-panel { display: flex; flex-direction: column; min-width: 0; }
  .split-divider { display: none; }

  /* Landscape (a TV mounted sideways, or a tablet turned flat) — switch
     to side-by-side columns of equal width. Deliberately NOT clipped to
     a fixed half-height: a long menu (or, in future, a longer
     leaderboard) needs to stay fully visible rather than being cut off
     to fit a rigid box, so each column just grows to its own content
     height and the page scrolls to reveal whatever doesn't fit on
     screen at once — same guarantee as portrait mode. */
  @media (min-aspect-ratio: 6/5) and (min-width: 900px) {
    .split-main { flex-direction: row; align-items: flex-start; }
    .split-panel { flex: 1 1 50%; }
    .split-divider { display: block; align-self: stretch; width: 1px; background: var(--border-glass-strong); flex-shrink: 0; }
  }

  /* ---------- Leaderboard panel ---------- */
  .lb-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: clamp(12px, 2.2vw, 18px);
    border-bottom: 1px solid var(--border-glass-strong);
    margin-bottom: clamp(14px, 2.6vw, 22px);
    flex-shrink: 0;
  }
  .lb-panel-title {
    font-size: clamp(15px, 2.8vw, 22px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .lb-panel-period-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .lb-panel-period {
    font-size: clamp(10px, 1.7vw, 13px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent-main);
    padding: 4px 12px;
    border: 1px solid var(--border-glass-strong);
    border-radius: var(--radius-full);
    transition: opacity 0.4s ease, transform 0.4s ease;
    white-space: nowrap;
  }
  /* Thin progress rail under the period pill — fills up over the 12s
     rotation so it's visibly, obviously counting down to the next
     swap instead of just silently changing. */
  .lb-panel-progress {
    width: 64px;
    height: 3px;
    border-radius: var(--radius-full);
    background: var(--border-glass-strong);
    overflow: hidden;
  }
  .lb-panel-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-main);
    border-radius: var(--radius-full);
  }

  .lb-panel-list {
    display: flex;
    flex-direction: column;
    gap: clamp(9px, 1.8vw, 14px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .lb-panel-row {
    display: flex;
    align-items: center;
    gap: clamp(12px, 2.2vw, 18px);
    padding: clamp(9px, 1.8vw, 14px) clamp(12px, 2.2vw, 18px);
    border-radius: var(--radius-lg);
    background: var(--bg-card);
    border: 1px solid var(--border-glass);
  }
  .lb-panel-row.lb-panel-top1 { border-color: var(--accent-main); box-shadow: 0 4px 20px rgba(255,255,255,0.10); }
  .lb-panel-rank {
    width: clamp(24px, 4.4vw, 34px);
    flex-shrink: 0;
    text-align: center;
    font-size: clamp(14px, 2.6vw, 20px);
    font-weight: 800;
    color: var(--text-secondary);
  }
  .lb-panel-rank.lb-panel-medal { font-size: clamp(18px, 3.4vw, 26px); }
  .lb-panel-avatar {
    width: clamp(34px, 6.2vw, 50px);
    height: clamp(34px, 6.2vw, 50px);
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: #fff;
  }
  .lb-panel-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lb-panel-name {
    flex: 1;
    min-width: 0;
    font-size: clamp(13px, 2.4vw, 18px);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lb-panel-stamps {
    flex-shrink: 0;
    font-size: clamp(13px, 2.4vw, 18px);
    font-weight: 800;
    color: var(--accent-main);
    white-space: nowrap;
  }
  .lb-panel-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 6vh 0;
    font-size: clamp(13px, 2.2vw, 17px);
  }

  /* ---------- Menu panel ---------- */
  .menu-panel-title {
    font-size: clamp(15px, 2.8vw, 22px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding-bottom: clamp(12px, 2.2vw, 18px);
    border-bottom: 1px solid var(--border-glass-strong);
    margin-bottom: clamp(14px, 2.6vw, 22px);
    flex-shrink: 0;
  }
  .tv-grid { column-count: 1; }
  .tv-category { break-inside: avoid; margin-bottom: clamp(14px, 2.8vw, 24px); }
  .tv-category-title {
    font-size: clamp(11px, 1.9vw, 15px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-primary);
    padding-bottom: clamp(6px, 1.2vw, 10px);
    margin-bottom: clamp(8px, 1.6vw, 13px);
    border-bottom: 1px solid var(--border-glass-strong);
  }
  .tv-item { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: clamp(5px, 1vw, 8px) 0; }
  .tv-item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tv-item-name {
    font-size: clamp(13px, 2.3vw, 17px);
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tv-item-sub { font-size: clamp(10px, 1.6vw, 12px); color: var(--text-muted); }
  .tv-item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .tv-item-price { font-size: clamp(13px, 2.3vw, 17px); font-weight: 700; color: var(--text-primary); white-space: nowrap; }
  .tv-item-bonus {
    font-size: clamp(8px, 1.3vw, 10px);
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--text-inverse);
    background: var(--accent-main);
    border-radius: var(--radius-full);
    padding: 3px 7px;
    white-space: nowrap;
  }
  .tv-empty { color: var(--text-muted); font-size: clamp(13px, 2.2vw, 17px); text-align: center; padding: 6vh 0; }

  /* ---------- Join QR card — normal document flow, never overlaps
     content (it used to float fixed over the bottom of the page,
     which could sit on top of the last menu items). ---------- */
  .tv-join {
    position: relative;
    z-index: 1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 2.6vw, 20px);
    background: var(--bg-card);
    border: 1px solid var(--border-glass-strong);
    border-radius: var(--radius-xl);
    padding: clamp(14px, 2.6vw, 20px) clamp(18px, 3.2vw, 26px);
    box-shadow: var(--shadow-lg);
    margin-top: clamp(28px, 5vw, 44px);
  }
  .tv-join-qr { line-height: 0; flex-shrink: 0; }
  .tv-join-qr img, .tv-join-qr canvas { display: block; width: clamp(64px, 11vw, 84px); height: clamp(64px, 11vw, 84px); }
  .tv-join-text { display: flex; flex-direction: column; gap: 2px; }
  .tv-join-title { font-size: clamp(14px, 2.6vw, 18px); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
  .tv-join-sub { font-size: clamp(11px, 2vw, 14px); color: var(--text-secondary); max-width: 26ch; }

</style>
</head>
<body>
  <div class="tv-glow" aria-hidden="true"></div>

  <div id="fit-wrapper">
  <header class="tv-header">
    <div class="tv-brand">
      <img src="Group 9.png" alt="Eightysix° Logo" class="tv-logo">
      <div class="tv-brand-text">
        <div class="tv-title">Leaderboard</div>
        <div class="tv-subtitle">Eightysix° Coffee</div>
      </div>
    </div>
    <div>
      <div class="tv-clock" id="tv-clock">--:--</div>
      <div class="tv-date" id="tv-date">—</div>
    </div>
  </header>

  <div class="tv-campaign" id="tv-campaign"></div>

  <main class="split-main">
    <section class="split-panel">
      <div class="lb-panel-header">
        <div class="lb-panel-title">🏆 Top Regulars</div>
        <div class="lb-panel-period-wrap">
          <div class="lb-panel-period" id="lb-period-label">This Month</div>
          <div class="lb-panel-progress"><div class="lb-panel-progress-fill" id="lb-progress-fill"></div></div>
        </div>
      </div>
      <div class="lb-panel-list" id="lb-panel-list">
        <div class="lb-panel-empty">Loading leaderboard…</div>
      </div>
    </section>

    <div class="split-divider"></div>

    <section class="split-panel">
      <div class="menu-panel-title">Menu</div>
      <div class="tv-grid" id="tv-grid">
        <div class="tv-empty">Loading menu…</div>
      </div>
    </section>
  </main>

  <div class="tv-join">
    <div class="tv-join-qr" id="tv-join-qr"></div>
    <div class="tv-join-text">
      <div class="tv-join-title">Scan to Join</div>
      <div class="tv-join-sub">Earn a stamp per order — free coffee at 10</div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./lib/qrcode.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://edunsrtcdhnpbsipalhc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_eBMuMX2di-IB74UsVk9rTQ_lcvNyPCv';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const DICEBEAR_STYLE = 'croodles-neutral';
    function avatarUrl(seed) {
      return `https://api.dicebear.com/10.x/${DICEBEAR_STYLE}/svg?seed=${encodeURIComponent(seed || 'person')}&backgroundColor=ffffff`;
    }

    // ---- Join QR ----
    new QRCode(document.getElementById('tv-join-qr'), {
      text: window.location.origin + '/index.html#signup',
      width: 200,
      height: 200,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    // ==========================================
    // STATIC FIT — no scrolling. #fit-wrapper is measured against the
    // real viewport height and, if its natural content would overflow,
    // scaled down as a whole (uniform transform: scale) until it fits.
    // transform doesn't affect layout/scrollHeight, so this is safe to
    // call repeatedly regardless of any scale already applied. Runs
    // after every render that can change content height (menu/
    // leaderboard/campaign updates, period rotation) and on resize.
    // ==========================================
    function autoFit() {
      const wrapper = document.getElementById('fit-wrapper');
      wrapper.style.transform = 'none';
      const contentHeight = wrapper.scrollHeight;
      const available = window.innerHeight;
      const scale = Math.min(1, available / contentHeight);
      wrapper.style.transform = scale < 0.999 ? `scale(${scale})` : 'none';
    }
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(autoFit, 150);
    });
    // Web fonts can finish loading fractionally after first paint and
    // nudge text metrics — re-check once they're settled.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(autoFit).catch(() => {});
    }

    // ---- Live clock ----
    function tickClock() {
      const now = new Date();
      document.getElementById('tv-clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('tv-date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ==========================================
    // LEADERBOARD — alternates between "This Month" and "All Time"
    // every 12s so an unattended display stays interesting instead of
    // showing one static list all day. Both lists are fetched together;
    // the rotation just toggles which cached list is shown. A filling
    // progress rail under the period pill makes the countdown to the
    // next swap visible instead of the change just happening silently.
    // ==========================================
    let lbPeriod = 'month';
    let lbMonthly = [];
    let lbAllTime = [];

    function renderLeaderboardPanel() {
      const data = lbPeriod === 'month' ? lbMonthly : lbAllTime;
      const list = document.getElementById('lb-panel-list');
      document.getElementById('lb-period-label').textContent = lbPeriod === 'month' ? 'This Month' : 'All Time';
      list.innerHTML = '';

      if (!data.length) {
        const empty = document.createElement('div');
        empty.className = 'lb-panel-empty';
        empty.textContent = lbPeriod === 'month' ? 'No stamps yet this month — be the first!' : 'No stamps yet — be the first!';
        list.appendChild(empty);
        autoFit();
        return;
      }

      data.forEach((entry, idx) => {
        const rank = idx + 1;
        const row = document.createElement('div');
        row.className = 'lb-panel-row' + (rank === 1 ? ' lb-panel-top1' : '');

        const rankEl = document.createElement('div');
        rankEl.className = 'lb-panel-rank' + (rank <= 3 ? ' lb-panel-medal' : '');
        rankEl.textContent = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : String(rank);
        row.appendChild(rankEl);

        const avatar = document.createElement('div');
        avatar.className = 'lb-panel-avatar';
        const img = document.createElement('img');
        img.src = avatarUrl(entry.avatar);
        img.alt = '';
        img.loading = 'lazy';
        avatar.appendChild(img);
        row.appendChild(avatar);

        const name = document.createElement('div');
        name.className = 'lb-panel-name';
        name.textContent = entry.name;
        row.appendChild(name);

        const stamps = document.createElement('div');
        stamps.className = 'lb-panel-stamps';
        stamps.textContent = `${entry.stamps} ☕`;
        row.appendChild(stamps);

        list.appendChild(row);
      });
      autoFit();
    }

    async function fetchLeaderboards() {
      try {
        const [monthRes, allRes] = await Promise.all([
          sb.rpc('get_leaderboard_monthly', { p_limit: 8 }),
          sb.rpc('get_leaderboard', { p_limit: 8 })
        ]);
        if (!monthRes.error && monthRes.data) {
          lbMonthly = monthRes.data.map(d => ({ name: d.name, avatar: d.avatar, stamps: d.monthly_stamps }));
        }
        if (!allRes.error && allRes.data) {
          lbAllTime = allRes.data.map(d => ({ name: d.name, avatar: d.avatar, stamps: d.total_stamps_earned }));
        }
        renderLeaderboardPanel();
      } catch (e) {}
    }

    function rotateLeaderboardPeriod() {
      const list = document.getElementById('lb-panel-list');
      const label = document.getElementById('lb-period-label');
      list.style.opacity = '0';
      list.style.transform = 'translateY(6px)';
      label.style.opacity = '0';
      setTimeout(() => {
        lbPeriod = lbPeriod === 'month' ? 'alltime' : 'month';
        renderLeaderboardPanel();
        list.style.opacity = '1';
        list.style.transform = 'translateY(0)';
        label.style.opacity = '1';
      }, 350);
    }

    // Restarts the 12s fill animation in sync with each rotation —
    // toggling the class forces the browser to replay it from 0%.
    // Toggling a class + reflow restarts a CSS *animation*, but not a
    // *transition* — the property and the transition itself change
    // together in one style recalc, so the browser never sees a
    // separate "before" state to animate from. Driving it via inline
    // styles with an explicit transition:none reset in between is the
    // reliable way to restart a transition-based fill like this.
    function restartProgressRail() {
      const fill = document.getElementById('lb-progress-fill');
      fill.style.transition = 'none';
      fill.style.width = '0%';
      void fill.offsetWidth; // force the reset to actually paint first
      fill.style.transition = 'width 12s linear';
      fill.style.width = '100%';
    }
    restartProgressRail();

    // ==========================================
    // MENU — same rendering as menu.html.
    // ==========================================
    function renderMenu(items) {
      const grid = document.getElementById('tv-grid');
      grid.innerHTML = '';
      if (!items || !items.length) {
        grid.innerHTML = '<div class="tv-empty">Menu coming soon.</div>';
        autoFit();
        return;
      }

      const categories = {};
      items.forEach(item => {
        if (!categories[item.category]) categories[item.category] = [];
        categories[item.category].push(item);
      });

      for (const [catName, catItems] of Object.entries(categories)) {
        const catDiv = document.createElement('div');
        catDiv.className = 'tv-category';

        const title = document.createElement('div');
        title.className = 'tv-category-title';
        title.textContent = catName;
        catDiv.appendChild(title);

        catItems.forEach(item => {
          const row = document.createElement('div');
          row.className = 'tv-item';

          const main = document.createElement('div');
          main.className = 'tv-item-main';
          const name = document.createElement('div');
          name.className = 'tv-item-name';
          name.textContent = item.name;
          main.appendChild(name);
          if (item.sub) {
            const sub = document.createElement('div');
            sub.className = 'tv-item-sub';
            sub.textContent = item.sub;
            main.appendChild(sub);
          }
          row.appendChild(main);

          const right = document.createElement('div');
          right.className = 'tv-item-right';
          if (item.stamps > 0) {
            const bonus = document.createElement('span');
            bonus.className = 'tv-item-bonus';
            bonus.textContent = `+${item.stamps} STAMPS`;
            right.appendChild(bonus);
          }
          const price = document.createElement('span');
          price.className = 'tv-item-price';
          price.textContent = `${parseFloat(item.price)} MKD`;
          right.appendChild(price);
          row.appendChild(right);

          catDiv.appendChild(row);
        });

        grid.appendChild(catDiv);
      }
      autoFit();
    }

    // Cache-first paint (same key the main app uses), then network.
    try {
      const cached = localStorage.getItem('86_menu');
      if (cached) renderMenu(JSON.parse(cached));
    } catch (e) {}

    async function fetchMenu() {
      try {
        const { data, error } = await sb.from('menu_items').select('*').order('created_at', { ascending: true });
        if (error || !data) return;
        const items = data.map(d => ({ id: d.id, name: d.name, sub: d.sub || '', price: d.price, category: d.category, stamps: d.stamps || 0 }));
        renderMenu(items);
        localStorage.setItem('86_menu', JSON.stringify(items));
      } catch (e) {}
    }

    async function fetchCampaign() {
      try {
        const { data, error } = await sb.rpc('get_campaign_status');
        const el = document.getElementById('tv-campaign');
        if (error || !data || !data.length || !data[0].active) {
          el.classList.remove('show');
          autoFit();
          return;
        }
        el.textContent = `✨ ${data[0].label || 'Double Stamps'} — ${data[0].multiplier}x stamps on every order!`;
        el.classList.add('show');
        autoFit();
      } catch (e) {}
    }

    fetchLeaderboards();
    fetchMenu();
    fetchCampaign();

    // Realtime for menu/campaign — both tables are intentionally public-
    // readable so this actually works. The leaderboard is derived from
    // the customers table, which (correctly) has no public read grant —
    // realtime can't subscribe to it from here, so it's covered by the
    // polling loop below instead.
    sb.channel('tv-leaderboard-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'menu_items' }, fetchMenu)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'campaigns' }, fetchCampaign)
      .subscribe();

    setInterval(fetchLeaderboards, 60000);
    setInterval(fetchMenu, 60000);
    setInterval(fetchCampaign, 60000);
    setInterval(() => { rotateLeaderboardPeriod(); restartProgressRail(); }, 12000);

    // An always-on TV/tablet tab can accumulate memory/stale-connection
    // issues over days — a clean reload once every 6 hours keeps it healthy.
    setTimeout(() => window.location.reload(), 6 * 60 * 60 * 1000);
  </script>
</body>
</html>
